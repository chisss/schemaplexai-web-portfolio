<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="description" content="SchemaPlexAI — AI 驱动的工作规范与智能体协作平台" />
    <title>SchemaPlexAI</title>

    <link rel="icon" type="image/svg+xml" href="/schemaplexai.svg" />

    <!--
      字体加载优化：
      1. preconnect 提前握手，消除 DNS + TLS 建连延迟
      2. <link rel="stylesheet"> 替代 CSS @import（非阻塞），浏览器并行下载
      3. display=swap：立即显示系统备用字体，加载完毕再替换（避免 FOIT 不可见闪烁）
      4. 三个字族合并为一个请求，减少 RTT
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
